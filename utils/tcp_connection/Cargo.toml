[package]
name = "tcp_connection"
edition = "2024"
version.workspace = true

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rmp-serde = "1.3.0"

# Error handling
thiserror = "2.0.17"

# Uuid & Random
uuid = "1.18.1"

# Crypto
ed25519-dalek = "2.2.0"
rsa = { version = "0.9", features = ["pkcs5", "sha2"] }
ring = "0.17"
rand = "0.10"
base64 = "0.22"
pem = "3.0"
crc = "3.3"
blake3 = "1.8"
