language = "C"

documentation = true
documentation_style = "doxy"

line_length = 75
tab_width = 2
braces = "SameLine"

header = """
/*!
 * This file is automatically generated by cbindgen.
 * DO NOT EDIT THIS FILE MANUALLY.
 *
 * All string-returning functions allocate memory that must be freed using JV_FreeString().
 */
"""

include_guard = "JVLIB_H"

include_version = true

[parse]
parse_deps = true
include = ["constants"]
extra_bindings = ["constants"]
expand = { crates = ["constants"] }

[export]
include = ["JV_.*"]
exclude = []

[fn]
sort_by = "Name"
rename_args = "None"

[const]
sort_by = "Name"

[struct]
rename_fields = "None"

[enum]
rename_variants = "None"
enum_class = false
